_version: 2
secrets.keychain.open_failed:
  en: "Could not open the system keychain item: %{reason}"
  zh-CN: 打开系统钥匙串条目失败：%{reason}
secrets.keychain.read_failed:
  en: "Could not read the system keychain item: %{reason}"
  zh-CN: 读取系统钥匙串条目失败：%{reason}
secrets.keychain.write_failed:
  en: "Could not write the system keychain item: %{reason}"
  zh-CN: 写入系统钥匙串条目失败：%{reason}
secrets.keychain.delete_failed:
  en: "Could not delete the system keychain item: %{reason}"
  zh-CN: 删除系统钥匙串条目失败：%{reason}
secrets.keychain.no_store:
  en: System keychain unavailable
  zh-CN: 系统钥匙串不可用
secrets.keychain.no_access:
  en: System keychain is locked or access was denied
  zh-CN: 系统钥匙串被锁定或拒绝访问
secrets.keychain.too_long:
  en: "Exceeds the system keychain's %{limit}-character limit"
  zh-CN: 超过系统钥匙串 %{limit} 个字符的长度上限
