_version: 2
# 凭据面板（工单 14）
credential.panel.title:
  en: Credentials
  zh-CN: 凭据
credential.panel.new:
  en: New Credential
  zh-CN: 新建凭据
credential.panel.collapse:
  en: Collapse Panel
  zh-CN: 收起面板
credential.panel.empty:
  en: No credentials yet
  zh-CN: 还没有凭据
credential.panel.empty_hint:
  en: Passwords, keys or SSH Agent shared by several hosts. Click + above to create one
  zh-CN: 多台主机共用的密码、密钥或 SSH Agent，点上面的 + 新建一个
credential.panel.hosts:
  en: "%{count} hosts"
  zh-CN: "%{count} 台主机"
credential.panel.hosts_one:
  en: "%{count} host"
  zh-CN: "%{count} 台主机"
credential.panel.unused:
  en: Unused
  zh-CN: 未使用

# 类型
credential.kind.password:
  en: Password
  zh-CN: 密码
credential.kind.key:
  en: Key
  zh-CN: 密钥
credential.kind.agent:
  en: SSH Agent
  zh-CN: SSH Agent

# 右键菜单
credential.menu.edit:
  en: Edit…
  zh-CN: 编辑…
credential.menu.copy_public_key:
  en: Copy Public Key
  zh-CN: 复制公钥
credential.menu.delete:
  en: Delete
  zh-CN: 删除
credential.public_key_copied:
  en: Public key copied. Paste it into ~/.ssh/authorized_keys on the server
  zh-CN: 公钥已复制，贴进服务器的 ~/.ssh/authorized_keys
credential.public_key_unknown:
  en: Could not read the public key of this private key (old encrypted keys do not carry one)
  zh-CN: 读不出这把私钥的公钥（老格式的加密私钥不带公钥）

# 凭据对话框
credential.dialog.title_new:
  en: New Credential
  zh-CN: 新建凭据
credential.dialog.title_edit:
  en: Edit Credential
  zh-CN: 编辑凭据
credential.dialog.subtitle_stacked:
  en: Selected automatically after saving
  zh-CN: 保存后自动选上
credential.dialog.name:
  en: Name
  zh-CN: 名称
credential.dialog.name_placeholder:
  en: "For example: Deploy Key"
  zh-CN: 例如：部署密钥
credential.dialog.name_required:
  en: Name is required
  zh-CN: 名称不能为空
credential.dialog.kind:
  en: Type
  zh-CN: 类型
credential.dialog.user:
  en: Username
  zh-CN: 用户名
credential.dialog.password:
  en: Password
  zh-CN: 密码
credential.dialog.password_placeholder:
  en: Required
  zh-CN: 必填
credential.dialog.password_required:
  en: Enter a password
  zh-CN: 请输入密码
credential.dialog.source:
  en: Private Key Source
  zh-CN: 私钥来源
credential.dialog.source_kept:
  en: Current Key
  zh-CN: 当前私钥
credential.dialog.source_file:
  en: Local File
  zh-CN: 本机文件
credential.dialog.source_paste:
  en: Paste
  zh-CN: 粘贴
credential.dialog.source_generate:
  en: Generate New Key
  zh-CN: 生成新密钥
credential.dialog.file:
  en: File
  zh-CN: 文件
credential.dialog.file_placeholder:
  en: "Path to the private key file, for example ~/.ssh/id_ed25519"
  zh-CN: 私钥文件的路径，例如 ~/.ssh/id_ed25519
credential.dialog.choose_file:
  en: Choose…
  zh-CN: 选择…
credential.dialog.file_hint:
  en: An encrypted copy is stored in the vault; the original file is not read again
  zh-CN: 复制一份加密存进保险库，原文件不再读取
credential.dialog.file_required:
  en: Choose a private key file
  zh-CN: 请选择私钥文件
credential.dialog.file_unreadable:
  en: Could not read this file
  zh-CN: 读不出这个文件
credential.dialog.key_text:
  en: Private Key
  zh-CN: 私钥
credential.dialog.key_text_placeholder:
  en: Paste the private key, starting with -----BEGIN
  zh-CN: 粘贴私钥，以 -----BEGIN 开头
credential.dialog.key_empty:
  en: Paste the private key
  zh-CN: 请粘贴私钥
credential.dialog.key_is_public:
  en: This is a public key (the half that lives on the server). Paste the private key instead
  zh-CN: 这是公钥（放在服务器上的那一半），请粘贴私钥
credential.dialog.key_unreadable:
  en: Could not read this private key
  zh-CN: 读不出这把私钥
credential.dialog.kept_hint:
  en: The key is stored encrypted in the vault. To change it, choose a local file, paste one, or generate a new key
  zh-CN: 私钥已加密存在保险库里；换私钥就选本机文件、粘贴或生成新密钥
credential.dialog.algorithm:
  en: Algorithm
  zh-CN: 算法
credential.dialog.public_key:
  en: Public Key
  zh-CN: 公钥
credential.dialog.copy_public_key:
  en: Copy Public Key
  zh-CN: 复制公钥
credential.dialog.public_key_hint:
  en: Paste it into ~/.ssh/authorized_keys on the server
  zh-CN: 贴进服务器的 ~/.ssh/authorized_keys
credential.dialog.generating:
  en: Generating…
  zh-CN: 正在生成…
credential.dialog.generate_failed:
  en: "Could not generate the key: %{error}"
  zh-CN: 生成密钥失败：%{error}
credential.dialog.still_generating:
  en: The key is still being generated; wait a moment before saving
  zh-CN: 密钥还在生成，稍等一下再保存
credential.dialog.encode_failed:
  en: "Could not save the key encrypted: %{error}"
  zh-CN: 密钥没能加密保存：%{error}
credential.dialog.passphrase:
  en: Passphrase
  zh-CN: 口令
credential.dialog.passphrase_placeholder:
  en: Optional; leave empty if the key has no passphrase
  zh-CN: 可选，私钥没有口令就留空
credential.dialog.agent_hint:
  en: Signs in with a key from the SSH Agent; MicaTerm stores no secrets
  zh-CN: 登录时用 SSH Agent 里的密钥，MicaTerm 不保存任何秘密
credential.dialog.agent_hint_windows:
  en: Signs in with a key from the Windows OpenSSH Authentication Agent service; MicaTerm stores no secrets
  zh-CN: 登录时用 Windows 的 OpenSSH Authentication Agent 服务里的密钥，MicaTerm 不保存任何秘密
credential.dialog.usage:
  en: "%{count} hosts use this credential and will follow the change after saving"
  zh-CN: 有 %{count} 台主机在用这条凭据，保存后它们跟着改
credential.dialog.usage_one:
  en: "%{count} host uses this credential and will follow the change after saving"
  zh-CN: 有 %{count} 台主机在用这条凭据，保存后它们跟着改
credential.dialog.cancel:
  en: Cancel
  zh-CN: 取消
credential.dialog.save:
  en: Save
  zh-CN: 保存
credential.dialog.saving:
  en: Saving…
  zh-CN: 正在保存…

# 删除凭据
credential.delete.title:
  en: Delete Credential
  zh-CN: 删除凭据
credential.delete.question:
  en: 'Delete "%{name}"?'
  zh-CN: 确定删除「%{name}」吗？
credential.delete.users:
  en: "%{count} hosts use it:"
  zh-CN: 有 %{count} 台主机在用它：
credential.delete.users_one:
  en: "%{count} host uses it:"
  zh-CN: 有 %{count} 台主机在用它：
credential.delete.then_password:
  en: After deletion, those hosts switch to "Password" authentication and keep the username %{user}.
  zh-CN: 删除后，这些主机的认证改成「密码」，用户名 %{user} 保留。
credential.delete.then_no_password:
  en: After deletion, those hosts switch to "No Password" authentication and keep the username %{user}.
  zh-CN: 删除后，这些主机的认证改成「无密码」，用户名 %{user} 保留。
credential.delete.secrets_password:
  en: The password in the vault is deleted too.
  zh-CN: 保险库里的密码一起删除。
credential.delete.secrets_key:
  en: The private key and passphrase in the vault are deleted too.
  zh-CN: 保险库里的私钥和口令一起删除。
credential.delete.cancel:
  en: Cancel
  zh-CN: 取消
credential.delete.confirm:
  en: Delete
  zh-CN: 删除
