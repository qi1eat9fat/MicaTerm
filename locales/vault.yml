  zh-CN: 保险库操作失败：%{error}
vault.error.damaged:
  zh-CN: 保险库文件已损坏：%{why}
vault.error.too_new:
  zh-CN: 保险库文件来自更新版本的 QiShell（格式 %{format}），这个版本打不开
vault.error.open_failed:
  zh-CN: 保险库打不开，这次运行保存的密码只在内存里，退出后丢失：%{error}
vault.reset.title:
  zh-CN: 重置保险库
vault.reset.text:
  zh-CN: 重置后清空所有保存的密码、口令和私钥，主机和凭据都保留，之后连接时现场询问。主密码也一起清除，下次保存秘密时再设。这一步不能撤销。
vault.reset.cancel:
  zh-CN: 取消
vault.reset.confirm:
  zh-CN: 重置
vault.key_lost.title:
  zh-CN: 保险库打不开
vault.key_lost.text:
  zh-CN: 这个保险库在另一台电脑上创建、没设主密码，这里打不开。重置后清空所有保存的密码、口令和私钥，主机和凭据都保留；不重置就这次现场输入密码。
vault.key_lost.save_text:
  zh-CN: 这个保险库在另一台电脑上创建、没设主密码，这里打不开，要先重置才能保存密码。重置后清空所有保存的密码、口令和私钥，主机和凭据都保留。
vault.key_lost.keep:
  zh-CN: 现场输入密码
vault.key_lost.cancel:
