  zh-CN: 这个保险库在另一台电脑上创建、没设主密码，这里打不开；重置后才能再保存秘密
settings.security.set_master:
  en: Set Master Password…
  zh-CN: 设置主密码…
settings.security.change_master:
  en: Change Master Password…
  zh-CN: 更换主密码…
settings.security.remember:
  en: Remember on This Computer
  zh-CN: 在本机记住
settings.security.remember_note:
  en: Stores the data key in Windows Credential Manager and unlocks automatically on this computer
  zh-CN: 数据密钥存进 Windows 凭据管理器，在这台电脑上自动解锁
settings.security.lock:
  en: Lock Vault
  zh-CN: 锁定保险库
settings.security.lock_note:
  en: Never locks automatically; after locking, the master password is asked the next time a secret is needed
  zh-CN: 不会自动锁定；锁定后下次用到秘密时再问主密码
settings.security.lock_now:
  en: Lock Now
  zh-CN: 立即锁定
settings.security.unlock:
  en: Unlock…
  zh-CN: 解锁…
settings.security.reset:
  en: Reset Vault
  zh-CN: 重置保险库
settings.security.reset_note:
  en: "The only option after forgetting the master password: hosts and credentials are kept; all saved passwords, passphrases and private keys are cleared"
  zh-CN: 忘了主密码只能这样做：主机和凭据都保留，清空所有保存的密码、口令和私钥
settings.security.reset_button:
  en: Reset Vault…
  zh-CN: 重置保险库…
settings.security.vault_file:
  en: "Vault file: data/vault.json (Argon2id key wrapping · XChaCha20-Poly1305 per-secret encryption)"
  zh-CN: 保险库文件：data/vault.json（Argon2id 派生包裹密钥 · XChaCha20-Poly1305 逐条加密）
settings.security.no_vault:
