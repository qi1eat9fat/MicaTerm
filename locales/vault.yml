vault.setup.title:
  zh-CN: 设置主密码
vault.setup.first_intro:
  zh-CN: 这是第一次保存密码。主密码用来加密 data/vault.json，防的是数据目录被拷走。
vault.setup.intro:
  zh-CN: 主密码用来加密 data/vault.json，防的是数据目录被拷走。已经存的秘密不用重新输入。
vault.setup.master:
  zh-CN: 主密码
