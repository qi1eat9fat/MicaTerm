settings.security.vault:
  en: Vault
  zh-CN: 保险库
settings.security.danger:
  en: Danger Zone
  zh-CN: 危险操作
settings.security.master:
  en: Master Password
  zh-CN: 主密码
settings.security.master_set:
  en: Set. Changing it only rewraps the data key; individual secrets are not re-encrypted
  zh-CN: 已设置。更换只重新包裹数据密钥，各条秘密不用重新加密
settings.security.master_unset:
  en: "No master password: secrets are protected only by this computer's keychain and cannot be opened on another computer"
  zh-CN: 没设主密码：秘密只靠本机钥匙串保护，拷到别的电脑就打不开
settings.security.master_lost:
