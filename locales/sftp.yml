  en: "The target changed during the download. An item with the same name already exists locally (%{count} bytes, modified %{modified}). Overwriting replaces it."
  zh-CN: 目标在下载期间发生变化。本地已有同名项目（%{count} 字节，修改时间 %{modified}）。覆盖会替换它。
