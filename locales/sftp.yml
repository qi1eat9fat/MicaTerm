  zh-CN: 目录与文件类型冲突，不会删除远程目录
sftp.upload.exists:
  en: "The remote item already exists (%{count} bytes, modified %{modified}). Overwriting replaces this file or link."
  zh-CN: 远程项目已存在（%{count} 字节，修改时间 %{modified}）。覆盖会替换这个文件或链接。
sftp.upload.exists_changed:
  en: "The target changed during the upload. The remote item already exists (%{count} bytes, modified %{modified}). Overwriting replaces this file or link."
  zh-CN: 目标在上传期间发生变化。远程项目已存在（%{count} 字节，修改时间 %{modified}）。覆盖会替换这个文件或链接。
sftp.upload.target_gone:
  en: The original target was deleted or moved during the upload. Publish this file anyway?
  zh-CN: 原目标在上传期间已被删除或移走。是否继续发布此文件？
sftp.upload.source_now_folder:
  en: The source became a folder; discard the old file progress and upload again, or skip it.
  zh-CN: 来源已变为目录，请丢弃旧文件进度后重新上传，或跳过。
sftp.upload.target_not_folder:
