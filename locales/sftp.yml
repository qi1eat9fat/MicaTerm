  zh-CN: 本地已有同名目录，不会删除它
sftp.download.exists:
  en: "An item with the same name already exists locally (%{count} bytes, modified %{modified}). Overwriting replaces it."
  zh-CN: 本地已有同名项目（%{count} 字节，修改时间 %{modified}）。覆盖会替换它。
