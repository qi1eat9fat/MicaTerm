  en: The upload write pipeline ended unexpectedly
  zh-CN: 上传写入流水线意外结束
sftp.upload.publish_unconfirmed:
  en: Could not confirm the publish result; recovery files were kept. Check the remote folder
  zh-CN: 无法确认文件发布结果，已保留恢复文件；请检查远端目录
sftp.upload.temporary_changed:
  en: The temporary file size or type changed; the target was not replaced
  zh-CN: 临时文件大小或类型已变化，未替换目标
sftp.upload.target_created:
