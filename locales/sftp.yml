  zh-CN: 「%{name}」：%{error}
sftp.worker.discard_offline:
  en: Cannot reach the host; the remote partial file and resume record are kept, and the next transfer of the same file will ask whether to resume
  zh-CN: 连不上主机，远程的半截文件和续传记录还留着，下次传同一个文件会问是否续传
