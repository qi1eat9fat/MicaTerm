  zh-CN: 续传记录中缺少来源文件信息
sftp.upload.temporary_kind_changed:
  en: The remote temporary file type changed
  zh-CN: 远端临时文件类型已变化
sftp.upload.partial_too_large:
  en: The remote resume offset is larger than the local file
  zh-CN: 远端续传偏移大于本地文件
