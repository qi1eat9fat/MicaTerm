agent.panel.handed:
  en: "%{card} has been handed to the Agent. The instruction is in the input box; press Enter to send"
  zh-CN: 已把 %{card} 交给 Agent，说明填在输入框里，按 Enter 发送
agent.prompt.handoff:
  en: "The user handed the remote card %{name} to you in MicaTerm. The card ID is %{card} and the host ID is %{host}. To run a command in that card, use micaterm exec --card %{card} followed by the command. To see its screen, use micaterm cards read %{card}. Look at the screen first, then wait for the user to say what to do."
  zh-CN: 用户在 MicaTerm 里把远程卡片 %{name} 交给了你，卡片 ID 是 %{card}，主机 ID 是 %{host}。在那张卡片里执行命令用 micaterm exec --card %{card} 加上要执行的命令，看它的屏幕用 micaterm cards read %{card}。先看一眼屏幕，再等用户说要做什么。
agent.prep.question:
  en: "%{agent} operates MicaTerm through the micaterm command. Before starting, set up these:"
  zh-CN: "%{agent} 经 micaterm 命令操作 MicaTerm，启动前先做好这几件事："
agent.prep.question_update:
  en: "MicaTerm has updated; the instructions %{agent} uses are out of date. Update them first:"
  zh-CN: MicaTerm 更新过，%{agent} 用的说明还是旧的，先更新：
agent.prep.enable_cli:
  en: Enable External Agents
  zh-CN: 启用外部 Agent
agent.prep.enable_cli_where:
  en: Settings › Agent master switch
  zh-CN: 设置 › Agent 的总开关
agent.prep.install_command:
  en: Install the command-line tool
  zh-CN: 安装命令行工具
