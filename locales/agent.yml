  zh-CN: 更新 %{agent} 的 Skill
agent.prep.note:
  en: Change these later in Settings › Agent
  zh-CN: 以后在 设置 › Agent 里改
agent.prep.handing:
  en: Handing %{card} to it
  zh-CN: 交给它 %{card}
agent.prep.cancel:
  en: Cancel
  zh-CN: 取消
