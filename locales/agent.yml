agent.no_command.title:
  en: Agent Command Not Found
  zh-CN: 找不到 Agent 命令
agent.no_command.text:
  en: "Neither claude nor codex is on PATH. Install Claude Code or Codex and try again, or set the command to run in Settings."
  zh-CN: PATH 里没有 claude 或 codex。装好 Claude Code 或 Codex 后再试，或者在设置里填要运行的命令。
agent.no_command.cancel:
  en: Cancel
  zh-CN: 取消
agent.no_command.settings:
  en: Open Settings
  zh-CN: 打开设置
agent.handoff.no_agent:
  en: "%{card} was handed over, but no Agent command was found and the Agent panel did not open. Run micaterm cards list in any terminal to see this card"
  zh-CN: 已把 %{card} 交出去。没找到 Agent 命令，Agent 面板没有打开；在任意终端里用 micaterm cards list 能看到这张卡片
agent.handoff.no_agent_cli_off:
  en: "%{card} was handed over, but \"Enable External Agents\" is off, so the Agent cannot use it yet (Settings › Agent)"
  zh-CN: 已把 %{card} 交出去，但「启用外部 Agent」没开，Agent 还用不了它（设置 › Agent）
