  en: External Agents are not enabled in MicaTerm. Turn on "Enable External Agents" under Settings › Agent
  zh-CN: MicaTerm 没有启用外部 Agent。请在 MicaTerm 的「设置 › Agent」里打开「启用外部 Agent」
