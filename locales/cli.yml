cli.env.command.exec_card:
  en: Run a command in a card handed to you (use this for bastion hosts that allow only one login)
  zh-CN: 在交给你的卡片里执行命令（只许登录一次的堡垒机用这个）
cli.env.command.cards_list:
  en: List cards handed to Agents
  zh-CN: 列出交给 Agent 的卡片
cli.env.command.cards_read:
  en: Read the last lines of a card's screen and scrollback
  zh-CN: 读卡片屏幕和滚动内容的最后几行
cli.env.command.cards_send_key:
  en: Press a key in a card (q, y, enter, ctrl-c…)
  zh-CN: 在卡片里按一个键（q、y、enter、ctrl-c…）
cli.env.command.upload:
  en: Upload files or folders
  zh-CN: 上传文件或文件夹
cli.env.command.download:
  en: Download files or folders
  zh-CN: 下载文件或文件夹
cli.env.command.sync:
  en: Sync a local folder to a host
  zh-CN: 把本机文件夹同步到主机
cli.env.command.hosts_manage:
  en: Create, modify and delete hosts (JSON on standard input)
  zh-CN: 新建、修改、删除主机（JSON 从标准输入读）
cli.env.command.credentials:
  en: Create, read, update and delete credentials (passwords are write-only)
  zh-CN: 凭据的增删改查（密码只写不读）
cli.env.command.help:
  en: Detailed usage for each command
  zh-CN: 每条命令的详细用法
