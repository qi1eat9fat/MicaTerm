  en: Automatic (no claude, codex or agy found)
  zh-CN: 自动检测（没找到 claude、codex 或 agy）
settings.cli.hooks:
  en: Agent Status
  zh-CN: Agent 状态
settings.cli.hooks_description:
  en: Lets the Agent panel and tabs know whether it is running, waiting for confirmation, or has ended its turn
  zh-CN: 让 Agent 面板和标签知道它在运行、等你确认还是回合结束
settings.cli.hooks_claude:
  en: Adds three hooks to %{file}; backs it up before changing. Most "waiting for confirmation" states are detected without it, just more slowly
  zh-CN: 在 %{file} 里加三个 hook，改之前先备份。不开也能认出大部分「等你确认」，只是慢一点
settings.cli.hooks_codex:
  en: Adds notify to %{file}; backs it up before changing
  zh-CN: 在 %{file} 里加 notify，改之前先备份
settings.cli.hooks_antigravity:
  en: Adds three hooks to %{file}; backs it up before changing. Reports when it starts working and when it ends its turn, not when it waits for confirmation
  zh-CN: 在 %{file} 里加三个 hook，改之前先备份。报开始干活和回合结束，报不了「等你确认」
settings.cli.hooks_failed:
  en: "Could not update the status hooks: %{error}"
  zh-CN: 状态 hook 没有改成：%{error}
settings.cli.hooks_not_object:
  en: hooks in settings.json is not an object; MicaTerm will not change it
  zh-CN: settings.json 的 hooks 不是对象，MicaTerm 不会改动它
settings.cli.hooks_not_array:
  en: hooks.%{event} in settings.json is not an array; MicaTerm will not change it
  zh-CN: settings.json 的 hooks.%{event} 不是数组，MicaTerm 不会改动它
settings.cli.hooks_bad_json:
  en: "settings.json is not valid JSON; MicaTerm will not change it: %{error}"
  zh-CN: settings.json 不是合法的 JSON，MicaTerm 不会改动它：%{error}
settings.cli.hooks_not_json_object:
  en: The top level of settings.json is not an object; MicaTerm will not change it
  zh-CN: settings.json 最外层不是对象，MicaTerm 不会改动它
settings.cli.hooks_agy_bad_json:
  en: "hooks.json is not valid JSON; MicaTerm will not change it: %{error}"
  zh-CN: hooks.json 不是合法的 JSON，MicaTerm 不会改动它：%{error}
settings.cli.hooks_agy_not_json_object:
  en: The top level of hooks.json is not an object; MicaTerm will not change it
  zh-CN: hooks.json 最外层不是对象，MicaTerm 不会改动它
settings.cli.hooks_agy_group_not_object:
  en: The "micaterm" entry in hooks.json is not an object; MicaTerm will not change it
  zh-CN: hooks.json 里的 "micaterm" 不是对象，MicaTerm 不会改动它
settings.cli.hooks_agy_event_not_array:
  en: The %{event} in the "micaterm" entry is not an array; MicaTerm will not change it
  zh-CN: hooks.json 的 "micaterm" 里，%{event} 不是数组，MicaTerm 不会改动它
settings.cli.hooks_foreign_notify:
  en: "config.toml already has another notify (%{line}); MicaTerm will not change it"
  zh-CN: config.toml 里已经有别的 notify（%{line}），MicaTerm 不会改动它
