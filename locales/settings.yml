settings.cli.agent_command:
  en: Agent Command
  zh-CN: Agent 命令
settings.cli.agent_command_description:
  en: "The command run in the Agent panel on the right. Leave empty to detect automatically: claude first (including the one bundled with Claude Desktop), then codex, then the Antigravity CLI (agy)"
  zh-CN: 右侧 Agent 面板里运行的命令。留空时自动检测，先找 claude（含 Claude 桌面版自带的），再找 codex，最后是 Antigravity CLI（agy）
