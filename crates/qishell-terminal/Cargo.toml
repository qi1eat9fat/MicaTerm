[package]
name = "qishell-terminal"
version = "0.1.0"
edition = "2024"
publish = false
description = "QiShell 的终端：驱动 alacritty_terminal 的引擎、TerminalView、查找、本地 PTY"
# 拷自 since2006/shell-rs @ b2a307a 的 src/terminal/（GPL-3.0），见 ADR 0002。
license = "GPL-3.0-only"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
async-channel = "2"
# 解析线程等输出时，只等到同步更新的期限。
async-io = "2"
futures = "0.3"
gpui-kit = { version = "0.6.1" }
portable-pty = "0.9"
# 文案只有简体中文，和 gpui-kit 用同一个 crate。
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"
# OSC 7 的 `file://` 目录报告。
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
# macOS 上读 shell 的当前目录（`proc_pidinfo`）。
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 卡片状态栏的 shell 版本：读 exe 的版本资源。
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }
regex = "1"
tempfile = "3"
