[package]
name = "qishell"
version = "0.1.0"
edition = "2024"
publish = false
description = "以 SSH 主机管理为核心的桌面终端，Rex 风格的卡片分屏"
license = "GPL-3.0-only"
default-run = "qishell"

# 桌面应用：单一二进制，同时带 lib target，好让 tests/ui/ 驱动生产环境的 Workspace。
[[bin]]
name = "qishell"
path = "src/main.rs"

[lib]
name = "qishell"
path = "src/lib.rs"

# crates/ 下的每个目录都是 workspace 成员（qishell-terminal、qishell-ssh、qishell-hosts……），
# 后续工单新建 crate 时不用改这里。
[workspace]
members = ["crates/*"]
resolver = "3"

[dependencies]
gpui-kit = { version = "0.6.1", features = [
    # 编辑器的语法高亮（工单 23）：`tree-sitter` 本身带 JSON。每个语法都是要编译的 C 代码，所以名单不加长。
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-yaml",
] }
anyhow = "1"
# 规范化本地路径，去掉 Windows 上 std 加的 `\\?\` 前缀。
dunce = "1"
# 文案翻译表：gpui-kit 自己的文案也用它。
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 从保险库读出来的密码用完清零（工单 11）。
zeroize = "1"
# 终端引擎、视图和本地 PTY（拷自 shell-rs，见 crates/qishell-terminal）。
qishell-terminal = { path = "crates/qishell-terminal" }
# 主机、凭据、命令片段的模型和写穿的数据库（拷自 shell-rs，见 crates/qishell-hosts）。
qishell-hosts = { path = "crates/qishell-hosts" }
# 系统钥匙串（Windows 凭据管理器、macOS 钥匙串、Secret Service）：只存保险库的数据密钥。
keyring = "4"
# SSH 连接（拷自 shell-rs，见 crates/qishell-ssh）：远程卡片和「测试连接」都经它登录（工单 12）。
qishell-ssh = { path = "crates/qishell-ssh" }
# 错误链里 russh 自己的错误（超时、算法谈不拢）要认出来翻成中文；和 qishell-ssh 用同一版。
russh = "0.63"
# 共享连接跑在 backend 自己的多线程运行时上：卡片关了连接不跟着断（工单 12）。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
# 远程终端把连接的事件（问答、延迟、系统）送到窗口壳；测试连接的问答用一次性通道。
async-channel = "2"
futures = "0.3"
# 开始卡片最近连接的「10 分钟前」「今天 09:12」：按本地时区算（gpui 本来就带着它）。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# SFTP 标签本地一侧：「下载」文件夹在哪（工单 20）；本地删除进回收站（工单 21）。
dirs = "6"
trash = "5"

# Mica 背景只在 Windows 11 22H2 及以上开（工单 26）：读系统 build 号；
# 窗口的深色模式属性跟着应用外观（Mica 的底色看它），要窗口句柄。
# 和 gpui-pre-windows 用同一版、它已经打开的 feature，不多编译东西。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
    # 窗口是不是最小化着（`IsIconic`，记住窗口用）。
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

# Windows 可执行文件里的图标与版本信息（build.rs）。
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }
# 进程内的 SSH 测试服务器（`qishell_ssh::testing`），backend 的连接测试用。
qishell-ssh = { path = "crates/qishell-ssh", features = ["testing"] }
# 测试用内存数据库（`HostDatabase::in_memory`）。
qishell-hosts = { path = "crates/qishell-hosts", features = ["testing"] }
regex = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# debug 版也把渲染栈优化起来（照 gpui-kit 的安装指南），否则渲染很卡；qishell 自己保持未优化、可调试。
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
swash = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
zed-font-kit = { opt-level = 3 }
# 保险库的 Argon2id：不优化时 64 MiB、3 遍要好几秒（照 shell-rs）。
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
# 凭据对话框「生成新密钥」的 RSA 4096：不优化时找素数要很久（工单 14）。
rsa = { opt-level = 3 }
crypto-bigint = { opt-level = 3 }
crypto-primes = { opt-level = 3 }
